<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ERP Seguridad LTDA - Recursos Humanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'lista_empleados' %}">ERP Seguridad LTDA | RRHH</a>

            {% if request.user.is_authenticated %}
            <div class="navbar-nav me-auto ms-3">
                <a class="nav-link text-white" href="{% url 'lista_empleados' %}">Fichas de Personal</a>
                <a class="nav-link text-info" href="{% url 'bitacora_auditoria' %}">Bitácora de Seguridad</a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-text text-white">
                    Usuario: <strong>{{ request.user.username }}</strong>
                </span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">Cerrar Sesión</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
